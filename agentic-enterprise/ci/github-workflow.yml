name: agentic-enterprise

on:
  push:
    paths: ["agentic-enterprise/**", ".github/workflows/agentic-enterprise.yml"]
  pull_request:
    paths: ["agentic-enterprise/**", ".github/workflows/agentic-enterprise.yml"]
  workflow_dispatch:
    inputs:
      live:
        description: "Run live-model evals (uses the ANTHROPIC_API_KEY secret; billable)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agentic-enterprise-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: agentic-enterprise

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22"
          cache: npm
          cache-dependency-path: agentic-enterprise/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run eval
      - name: Secret scan
        run: |
          if grep -rEn --exclude-dir=node_modules -e 'sk-ant-[A-Za-z0-9_-]{20,}' -e 'BEGIN (RSA |EC )?PRIVATE KEY' .; then
            echo "Possible secret committed"; exit 1; fi

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22"
          cache: npm
          cache-dependency-path: agentic-enterprise/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run mutation

  live-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' && inputs.live
    environment: live-model
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EVAL_LIVE_MAX_TOTAL_USD: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22"
          cache: npm
          cache-dependency-path: agentic-enterprise/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: test -n "$ANTHROPIC_API_KEY" || { echo "ANTHROPIC_API_KEY secret is not set"; exit 1; }
      - run: npm run eval:live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-eval-report
          path: agentic-enterprise/reports/
