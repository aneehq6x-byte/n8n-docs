[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenderpilot-analyzer"
version = "0.1.0"
description = "TenderPilot AI — Tender Analyzer: extracts requirements, risks and an explainable Opportunity Score from government tender documents."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.11,<2",
    "pydantic>=2.7,<3",
    "pypdf>=5",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
tenderpilot-analyze = "tenderpilot_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tenderpilot_analyzer = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
