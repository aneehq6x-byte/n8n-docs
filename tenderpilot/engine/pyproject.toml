[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenderpilot"
version = "0.2.0"
description = "TenderPilot AI engine: tender analysis, explainable Opportunity Score and bid drafting for government tenders."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.11,<2",
    "pydantic>=2.7,<3",
    "pypdf>=5",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
tenderpilot-analyze = "tenderpilot.cli:main"
tenderpilot-write = "tenderpilot.cli:write_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tenderpilot = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
